# ==============================================================================
# OpenMRS Virtual Host Configuration
# Reverse proxy routing, Let's Encrypt ACME challenge, and SSL/HSTS termination
# ==============================================================================

# Upstream definition for OpenMRS Tomcat container
upstream openmrs_backend {
    server openmrs-web:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Handles ACME Challenge & Redirects to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is issued in Task 1.5)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Default HTTP proxy pass (active during initial bootstrap before SSL cert generation)
    location / {
        proxy_pass http://openmrs_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffer & Timeout settings (tuned for large clinical form uploads)
        client_max_body_size 50M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — TLS Termination with HSTS & Hardened Ciphers
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost _;

    # SSL Certificates (managed via Certbot in /etc/letsencrypt/live/<domain>/)
    ssl_certificate /etc/letsencrypt/live/openmrs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openmrs/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/openmrs/chain.pem;

    # SSL Protocols & Ciphers (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy traffic to OpenMRS Tomcat backend
    location / {
        proxy_pass http://openmrs_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Buffer & Timeout settings
        client_max_body_size 50M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}
