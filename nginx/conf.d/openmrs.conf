# ==============================================================================
# OpenMRS Virtual Host Configuration
# Reverse proxy routing, Let's Encrypt ACME challenge, and SSL/HSTS termination
# ==============================================================================

# Upstream definition for OpenMRS Tomcat container
upstream openmrs_backend {
    server openmrs-web:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Handles Web Traffic & ACME Challenges
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Default HTTP proxy pass to OpenMRS backend
    location / {
        proxy_pass http://openmrs_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffer & Timeout settings (tuned for clinical forms & uploads)
        client_max_body_size 50M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}

