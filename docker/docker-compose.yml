services:
  # ----------------------------------------------------------------------------
  # MariaDB 10.11 Database Service (OpenMRS Reference App / 3.x Standard)
  # Strictly internal - NO host ports are published to prevent external ingress.
  # ----------------------------------------------------------------------------
  openmrs-db:
    image: mariadb:10.11.7
    container_name: openmrs-db
    restart: unless-stopped
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=2G
      --innodb-log-file-size=512M
      --innodb-file-per-table=1
      --max-connections=100
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openmrs}
      MYSQL_USER: ${MYSQL_USER:-openmrs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - openmrs-internal-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # OpenMRS Reference Application (Core & Web Distribution)
  # Internal service reverse-proxied by NGINX - NO host ports are published.
  # ----------------------------------------------------------------------------
  openmrs-web:
    image: openmrs/openmrs-reference-application-distro:latest
    container_name: openmrs-web
    restart: unless-stopped
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      DB_DATABASE: ${MYSQL_DATABASE:-openmrs}
      DB_USER: ${MYSQL_USER:-openmrs_user}
      DB_USERNAME: ${MYSQL_USER:-openmrs_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: openmrs-db
      DB_CREATE_TABLES: ${OPENMRS_CREATE_TABLES:-true}
      DB_AUTO_UPDATE: ${OPENMRS_AUTO_UPDATE_DATABASE:-true}
      MODULE_WEB_ADMIN: "true"
      JAVA_OPTS: "-Xms1024m -Xmx4096m -XX:+UseG1GC"
    volumes:
      - openmrs-app-data:/openmrs/data
    networks:
      - openmrs-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------------------------
  # NGINX Reverse Proxy & TLS Termination
  # Only service that exposes external ports (80 and 443) on the host.
  # ----------------------------------------------------------------------------
  openmrs-nginx:
    image: nginx:1.25-alpine
    container_name: openmrs-nginx
    restart: unless-stopped
    depends_on:
      - openmrs-web
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - openmrs-internal-net

  # ----------------------------------------------------------------------------
  # Certbot Let's Encrypt SSL Automated Renewal Service
  # Periodically checks and renews certificates via ACME challenge.
  # ----------------------------------------------------------------------------
  openmrs-certbot:
    image: certbot/certbot:latest
    container_name: openmrs-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    networks:
      - openmrs-internal-net

networks:
  openmrs-internal-net:
    name: openmrs-internal-net
    driver: bridge

volumes:
  openmrs-db-data:
    name: openmrs-db-data
  openmrs-app-data:
    name: openmrs-app-data
  certbot-etc:
    name: openmrs-certbot-etc
  certbot-www:
    name: openmrs-certbot-www
