services:
  # ----------------------------------------------------------------------------
  # MariaDB 10.11 Database Service (OpenMRS 3.x Standard)
  # Strictly internal - NO host ports published.
  # ----------------------------------------------------------------------------
  openmrs-db:
    image: mariadb:10.11.7
    container_name: openmrs-db
    restart: unless-stopped
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=2G
      --innodb-log-file-size=512M
      --innodb-file-per-table=1
      --max-connections=100
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openmrs}
      MYSQL_USER: ${MYSQL_USER:-openmrs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - openmrs-internal-net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # OpenMRS 3.x Backend (REST, FHIR2, Core API & Services)
  # ----------------------------------------------------------------------------
  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:${O3_TAG:-qa}
    container_name: openmrs-backend
    restart: unless-stopped
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      OMRS_DB_HOSTNAME: openmrs-db
      OMRS_DB_PORT: 3306
      OMRS_DB_NAME: ${MYSQL_DATABASE:-openmrs}
      OMRS_DB_USERNAME: ${MYSQL_USER:-openmrs_user}
      OMRS_DB_PASSWORD: ${MYSQL_PASSWORD}
      OMRS_ADMIN_USER_PASSWORD: ${OPENMRS_ADMIN_PASSWORD:-Admin123}
      OMRS_AUTO_UPDATE_DATABASE: "true"
      OMRS_CREATE_TABLES: "true"
      OMRS_MODULE_WEB_ADMIN: "true"
      OMRS_INSTALL_METHOD: "auto"
      OMRS_JAVA_MEMORY_OPTS: "-Xms1024m -Xmx4096m -XX:+UseG1GC"
    volumes:
      - openmrs-app-data:/openmrs/data
    networks:
      - openmrs-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------------------------
  # OpenMRS 3.x Frontend (Microfrontend SPA - React / Carbon Design System)
  # ----------------------------------------------------------------------------
  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${O3_TAG:-qa}
    container_name: openmrs-frontend
    restart: unless-stopped
    networks:
      - openmrs-internal-net

  # ----------------------------------------------------------------------------
  # NGINX Reverse Proxy & Unified TLS Gateway
  # ----------------------------------------------------------------------------
  openmrs-nginx:
    image: nginx:1.25-alpine
    container_name: openmrs-nginx
    restart: unless-stopped
    depends_on:
      - openmrs-backend
      - openmrs-frontend
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - openmrs-internal-net

  # ----------------------------------------------------------------------------
  # Certbot Let's Encrypt SSL Automated Renewal Service
  # ----------------------------------------------------------------------------
  openmrs-certbot:
    image: certbot/certbot:latest
    container_name: openmrs-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    networks:
      - openmrs-internal-net

networks:
  openmrs-internal-net:
    name: openmrs-internal-net
    driver: bridge

volumes:
  openmrs-db-data:
    name: openmrs-db-data
  openmrs-app-data:
    name: openmrs-app-data
  certbot-etc:
    name: openmrs-certbot-etc
  certbot-www:
    name: openmrs-certbot-www
