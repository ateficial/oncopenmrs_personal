- name: Update apt cache and upgrade all packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install baseline system utilities
  apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - htop
      - iotop
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present

- name: Set system timezone to Africa/Cairo
  command: timedatectl set-timezone Africa/Cairo
  changed_when: false
