---
# ==============================================================================
# OpenMRS GCP Pilot — Host Bootstrap Playbook
# Target OS: Ubuntu 22.04 LTS
# Idempotent provisioning: System hardening, UFW, Docker Engine, Swap & Sysctl
# ==============================================================================
- name: Bootstrap OpenMRS Host on Ubuntu 22.04 LTS
  hosts: openmrs_servers
  become: true
  vars:
    deploy_user: "{{ deploy_user | default('deploy') }}"
    timezone: "{{ timezone | default('Etc/UTC') }}"
    swap_size_gb: "{{ swap_size_gb | default(4) }}"
    sysctl_swappiness: "{{ sysctl_swappiness | default(10) }}"
    sysctl_max_map_count: "{{ sysctl_max_map_count | default(262144) }}"
    docker_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - ufw
      - fail2ban
      - htop
      - git
      - jq
      - unzip

  tasks:
    # --------------------------------------------------------------------------
    # 1. Base System Updates & Timezone
    # --------------------------------------------------------------------------
    - name: Set system timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install prerequisite base packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    # --------------------------------------------------------------------------
    # 2. Deploy User Management
    # --------------------------------------------------------------------------
    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: "{{ deploy_user }}"
        state: present

    - name: Create deploy user with sudo privileges
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Allow deploy user passwordless sudo
      ansible.builtin.copy:
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/90-{{ deploy_user }}-user"
        mode: "0440"
        validate: "visudo -cf %s"

    # --------------------------------------------------------------------------
    # 3. Swap Configuration (4GB)
    # --------------------------------------------------------------------------
    - name: Check if swapfile exists
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 4GB swapfile if not present
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size_gb }}G /swapfile"
      when: not swapfile_stat.stat.exists

    - name: Set permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Persist swapfile entry in /etc/fstab
      ansible.posix.mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    # --------------------------------------------------------------------------
    # 4. Linux Kernel & Sysctl Tuning
    # --------------------------------------------------------------------------
    - name: Configure sysctl parameters for OpenMRS & Postgres
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-openmrs.conf
        reload: true
      loop:
        - { name: "vm.swappiness", value: "{{ sysctl_swappiness }}" }
        - { name: "vm.max_map_count", value: "{{ sysctl_max_map_count }}" }
        - { name: "net.core.somaxconn", value: "1024" }
        - { name: "fs.file-max", value: "2097152" }

    # --------------------------------------------------------------------------
    # 5. UFW Firewall Baseline Configuration
    # --------------------------------------------------------------------------
    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH (Port 22)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP (Port 80)
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS (Port 443)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

    # --------------------------------------------------------------------------
    # 6. Official Docker Engine & Compose v2 Installation
    # --------------------------------------------------------------------------
    - name: Create keyrings directory for apt keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE, CLI, and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --------------------------------------------------------------------------
    # 7. Create Application Directory Structure
    # --------------------------------------------------------------------------
    - name: Create /opt/openmrs-pilot application directory
      ansible.builtin.file:
        path: /opt/openmrs-pilot
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Create local backup directory
      ansible.builtin.file:
        path: /var/backups/openmrs
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"
